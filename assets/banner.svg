<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#141024"/>
<stop offset="0.55" stop-color="#1b1638"/>
<stop offset="1" stop-color="#241a3f"/>
</linearGradient>
<linearGradient id="cart1" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ff8a4c"/>
<stop offset="1" stop-color="#e8532f"/>
</linearGradient>
<linearGradient id="cart2" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#4dd8f0"/>
<stop offset="1" stop-color="#2a9fc7"/>
</linearGradient>
<linearGradient id="cart3" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#c98bf5"/>
<stop offset="1" stop-color="#8f4fd1"/>
</linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#4dd8f0" stop-opacity="0.35"/>
<stop offset="1" stop-color="#4dd8f0" stop-opacity="0"/>
</radialGradient>
<linearGradient id="headGrad" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#ffffff"/>
<stop offset="1" stop-color="#c9e9f5"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

<!-- ambient glow -->
<circle cx="900" cy="180" r="260" fill="url(#glow)"/>

<!-- faint pixel grid -->
<g stroke="#ffffff" stroke-opacity="0.045">
<line x1="0" y1="40" x2="1200" y2="40"/>
<line x1="0" y1="80" x2="1200" y2="80"/>
<line x1="0" y1="120" x2="1200" y2="120"/>
<line x1="0" y1="160" x2="1200" y2="160"/>
<line x1="0" y1="200" x2="1200" y2="200"/>
<line x1="0" y1="240" x2="1200" y2="240"/>
<line x1="0" y1="280" x2="1200" y2="280"/>
<line x1="0" y1="320" x2="1200" y2="320"/>
<line x1="40" y1="0" x2="40" y2="360"/>
<line x1="120" y1="0" x2="120" y2="360"/>
<line x1="200" y1="0" x2="200" y2="360"/>
<line x1="280" y1="0" x2="280" y2="360"/>
<line x1="880" y1="0" x2="880" y2="360"/>
<line x1="960" y1="0" x2="960" y2="360"/>
<line x1="1040" y1="0" x2="1040" y2="360"/>
<line x1="1120" y1="0" x2="1120" y2="360"/>
</g>

<!-- shelf line -->
<line x1="800" y1="300" x2="1160" y2="300" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>

<!-- stacked ROM cartridges, tilted like a library shelf -->
<g transform="translate(830,90)">
  <g transform="rotate(-6)">
    <rect x="0" y="0" width="70" height="200" rx="8" fill="url(#cart3)" opacity="0.95"/>
    <rect x="8" y="14" width="54" height="26" rx="4" fill="#1b1638" opacity="0.55"/>
    <rect x="14" y="150" width="42" height="10" fill="#1b1638" opacity="0.4"/>
  </g>
</g>

<g transform="translate(905,80)">
  <g transform="rotate(-2)">
    <rect x="0" y="0" width="76" height="212" rx="8" fill="url(#cart2)"/>
    <rect x="10" y="16" width="56" height="28" rx="4" fill="#1b1638" opacity="0.55"/>
    <rect x="16" y="160" width="44" height="10" fill="#1b1638" opacity="0.4"/>
  </g>
</g>

<g transform="translate(988,88)">
  <g transform="rotate(5)">
    <rect x="0" y="0" width="72" height="204" rx="8" fill="url(#cart1)"/>
    <rect x="9" y="15" width="54" height="27" rx="4" fill="#1b1638" opacity="0.55"/>
    <rect x="15" y="155" width="42" height="10" fill="#1b1638" opacity="0.4"/>
  </g>
</g>

<g transform="translate(1065,78)">
  <g transform="rotate(-3)">
    <rect x="0" y="0" width="70" height="214" rx="8" fill="url(#cart2)" opacity="0.9"/>
    <rect x="8" y="16" width="54" height="26" rx="4" fill="#1b1638" opacity="0.55"/>
    <rect x="14" y="162" width="42" height="10" fill="#1b1638" opacity="0.4"/>
  </g>
</g>

<!-- small plug/connector motif suggesting "pluggable" -->
<g transform="translate(760,240)" opacity="0.85">
  <circle cx="0" cy="0" r="6" fill="#4dd8f0"/>
  <line x1="6" y1="0" x2="60" y2="0" stroke="#4dd8f0" stroke-width="3" stroke-dasharray="6 6"/>
  <circle cx="66" cy="0" r="6" fill="#ff8a4c"/>
</g>

<!-- headline -->
<text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="70" font-weight="700" fill="url(#headGrad)" textLength="700" lengthAdjust="spacingAndGlyphs">ROM Manager Desktop</text>

<!-- accent underline -->
<rect x="62" y="172" width="220" height="6" rx="3" fill="#ff8a4c"/>
<rect x="290" y="172" width="90" height="6" rx="3" fill="#4dd8f0" opacity="0.85"/>

<!-- tagline -->
<text x="60" y="220" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#cfd3e6" textLength="700" lengthAdjust="spacingAndGlyphs">Manage and organize your ROM library with a</text>
<text x="60" y="252" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#cfd3e6" textLength="600" lengthAdjust="spacingAndGlyphs">pluggable desktop interface for emulation ecosystems</text>

</svg>